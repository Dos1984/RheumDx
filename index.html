<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>RheumDx Work-up Assistant</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f5f7f9;color:#0b2e4f;display:grid;place-items:center;min-height:100vh}
    .card{max-width:620px;margin:24px;padding:28px;border:1px solid #dbe3e8;border-radius:16px;background:#fff;box-shadow:0 8px 30px rgba(11,46,79,.08)}
    h1{font-size:1.35rem;margin:0 0 10px}.muted{color:#526674}.bar{height:8px;background:#e6edef;border-radius:999px;overflow:hidden;margin-top:18px}.bar>span{display:block;height:100%;width:35%;background:#0e7c7b;border-radius:999px;animation:p 1.1s ease-in-out infinite alternate}@keyframes p{to{width:85%}}
    code{word-break:break-word}
  </style>
</head>
<body>
  <main class="card" id="status" role="status" aria-live="polite">
    <h1>Loading RheumDx…</h1>
    <div class="muted">Preparing the verified clinical decision-support application.</div>
    <div class="bar" aria-hidden="true"><span></span></div>
  </main>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    try{
      if(typeof DecompressionStream==='undefined') throw new Error('This browser does not support gzip decompression. Please use a current version of Chrome, Edge, Safari or Firefox.');
      const names=[
        'build/index.html.gz.b64.part00',
        'build/index.html.gz.b64.part01a',
        'build/index.html.gz.b64.part01b',
        'build/index.html.gz.b64.part02',
        'build/index.html.gz.b64.part03',
        'build/index.html.gz.b64.part04',
        'build/index.html.gz.b64.part05'
      ];
      const parts=[];
      for(const name of names){
        const r=await fetch(name,{cache:'no-store'});
        if(!r.ok) throw new Error(`Missing application component: ${name} (${r.status})`);
        parts.push((await r.text()).trim());
      }
      const b64=parts.join('').replace(/\s+/g,'');
      const bin=atob(b64);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html=await new Response(stream).text();
      if(!html.toLowerCase().includes('<!doctype html')&&!html.toLowerCase().includes('<html'))throw new Error('Application package did not decode to HTML.');
      const patched=html.replace(/<\/body>/i,'<script src="v13.patch.js"><\/script><script src="v14.patch.js"><\/script><script src="v15.patch.js"><\/script><script src="v16.patch.js"><\/script><script src="v17.patch.js"><\/script><script src="v18.patch.js"><\/script><script src="v19.patch.js"><\/script><script src="v20.patch.js"><\/script><script src="v21.patch.js"><\/script><script src="v22.patch.js"><\/script><script src="v23.patch.js"><\/script><script src="v24.patch.js"><\/script></body>');
      document.open();
      document.write(patched);
      document.close();
    }catch(err){
      status.innerHTML='<h1>RheumDx could not load</h1><p class="muted">'+String(err.message||err)+'</p><p class="muted">Please refresh once. If this persists, open the GitHub Actions page for the repository.</p>';
      console.error(err);
    }
  })();
  </script>
</body>
</html>
