<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rheum Case Assist</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;background:#f3f6f6;color:#0b2e4f;display:grid;place-items:center;min-height:100vh}
    .card{max-width:620px;margin:24px;padding:28px;border:1px solid #d8e4e4;border-radius:16px;background:#fff;box-shadow:0 8px 30px rgba(11,46,79,.08)}
    h1{font-size:1.35rem;margin:0 0 10px}.muted{color:#60717a}.bar{height:8px;background:#e2ebeb;border-radius:999px;overflow:hidden;margin-top:18px}.bar>span{display:block;height:100%;width:35%;background:#0e7c7b;border-radius:999px;animation:p 1.1s ease-in-out infinite alternate}@keyframes p{to{width:85%}}
  </style>
</head>
<body>
  <main class="card" id="status" role="status" aria-live="polite">
    <h1>Loading Rheum Case Assist…</h1>
    <div class="muted">Preparing the interactive rheumatology case-learning application.</div>
    <div class="bar" aria-hidden="true"><span></span></div>
  </main>
  <script>
  (async()=>{
    const status=document.getElementById('status');
    try{
      const r=await fetch('rheumsim.html',{cache:'no-store'});
      if(!r.ok) throw new Error('Could not load the case-learning package.');
      let html=await r.text();
      html=html.replace(/RheumSim/g,'Rheum Case Assist');
      html=html.replace(/<\/body>/i,'<script src="rheumcaseassist.patch.js"><\/script><script src="rheumcaseassist.v5.patch.js"><\/script></body>');
      document.open();document.write(html);document.close();
    }catch(err){
      status.innerHTML='<h1>Rheum Case Assist could not load</h1><p class="muted">'+String(err.message||err)+'</p><p class="muted">Please refresh once and try again.</p>';
    }
  })();
  </script>
</body>
</html>
