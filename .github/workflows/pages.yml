name: Verify RheumDx build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify v12 application
        shell: bash
        run: |
          set -euo pipefail
          cat build/index.html.gz.b64.part* | base64 --decode | gzip --decompress > /tmp/rheumdx-index.html
          echo "bf6e9aa8207d9bf667687bebc330bfe1b8ab4907ba6bcdf6da2e058c36e95b5f  /tmp/rheumdx-index.html" | sha256sum --check -
          grep -q "Dictate case" /tmp/rheumdx-index.html
          grep -q "Challenge / refine the reasoning" /tmp/rheumdx-index.html
          echo "RheumDx v12 package verified successfully."
