name: Deploy RheumDx to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct and verify application
        shell: bash
        run: |
          set -euo pipefail
          cat build/index.html.gz.b64.part* | base64 --decode | gzip --decompress > index.html
          echo "799355becdfe620ca58dd07807686a374a7c199bf0334fd3dd94b2404bf86ec4  index.html" | sha256sum --check -
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
